name: Torchdental
description: >-
  Torchdental (Torch Dental) is a B2B dental-supply procurement platform for
  independent dental practices and dental groups. It runs a web application at
  app.torchdental.com that lets practices order dental supplies and equipment
  from multiple vendors in one place, compare prices, manage recurring ordering
  and budgets, and streamline back-office purchasing. The company is venture
  backed and was surfaced as a portfolio company of Felicis. As of this
  enrichment pass Torchdental exposes no public developer/API surface: no
  api/docs/developer subdomains resolve, and the application host publishes no
  /.well-known/ discovery documents. This profile therefore captures company
  identity and probed domain-security posture only.
